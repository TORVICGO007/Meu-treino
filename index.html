<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino</title>
</head>
<body>
    
      <header>
    <h1>Meu Treino</h1>
    <p>Sistema para gerenciar treinos personalizados de musculação e acompanhar a evolução.</p>
      </header>


     <nav>
    <ul>
      <li><a href="#cadastro">Cadastrar treino</a></li>
      <li><a href="#listagem">Meus treinos</a></li>
      <li><a href="#detalhes">Detalhes do treino</a></li>
    </ul>
  </nav>

 <main>
 
    <!-- Cadastro dos Treinos -->
    <section id="cadastro">
      <h2>Cadastrar treino</h2>
 
      <form action="#" method="post">
 
        <fieldset>
          <legend>Dados do treino</legend>
 
          <p>
            <label for="nome">Nome do treino:</label><br>
            <input type="text" id="nome" name="nome" required>
          </p>
 
          <p>
            <label for="objetivo">Objetivo:</label><br>
            <select id="objetivo" name="objetivo" required>
              <option value="">Selecione</option>
              <option value="hipertrofia">Hipertrofia</option>
              <option value="emagrecimento">Emagrecimento</option>
              <option value="forca">Força</option>
              <option value="resistencia">Resistência</option>
            </select>
          </p>
 
          <p>
            <label for="grupo">Grupo muscular:</label><br>
            <select id="grupo" name="grupo" required>
              <option value="">Selecione</option>
              <option value="peito">Peito</option>
              <option value="costas">Costas</option>
              <option value="pernas">Pernas</option>
              <option value="ombros">Ombros</option>
              <option value="bracos">Braços</option>
              <option value="abdomen">Abdômen</option>
              <option value="corpo-inteiro">Corpo inteiro</option>
            </select>
          </p>
 
          <p>
            <label for="duracao">Duração (minutos):</label><br>
            <input type="number" id="duracao" name="duracao" min="1" max="300" required>
          </p>
 
          <p>
            <label for="data-inicio">Data de início:</label><br>
            <input type="date" id="data-inicio" name="data-inicio" required>
          </p>
 
          <p>
            <label for="data-atualizacao">Data de atualização:</label><br>
            <input type="date" id="data-atualizacao" name="data-atualizacao">
          </p>
 
          <fieldset>
            <legend>Nível de dificuldade</legend>
            <input type="radio" id="nivel-iniciante" name="nivel" value="iniciante" required>
            <label for="nivel-iniciante">Iniciante</label>
            <input type="radio" id="nivel-intermediario" name="nivel" value="intermediario">
            <label for="nivel-intermediario">Intermediário</label>
            <input type="radio" id="nivel-avancado" name="nivel" value="avancado">
            <label for="nivel-avancado">Avançado</label>
          </fieldset>
 
          <p>
            <label for="status">Status do treino:</label><br>
            <select id="status" name="status">
              <option value="ativo">Ativo</option>
              <option value="pausado">Pausado</option>
              <option value="concluido">Concluído</option>
            </select>
          </p>
        </fieldset>
 
        <fieldset>
          <legend>Exercício</legend>
 
          <p>
            <label for="exercicio">Nome do exercício:</label><br>
            <input type="text" id="exercicio" name="exercicio" required>
          </p>
 
          <p>
            <label for="series">Séries:</label><br>
            <input type="number" id="series" name="series" min="1" max="20" required>
          </p>
 
          <p>
            <label for="repeticoes">Repetições:</label><br>
            <input type="number" id="repeticoes" name="repeticoes" min="1" max="100" required>
          </p>
 
          <p>
            <label for="carga">Carga (kg):</label><br>
            <input type="number" id="carga" name="carga" min="0" step="0.5">
          </p>
 
          <p>
            <label for="descanso">Intervalo de descanso (segundos):</label><br>
            <input type="number" id="descanso" name="descanso" min="0" max="600" step="15">
          </p>
        </fieldset>
 
        <p>
          <label for="observacoes">Observações:</label><br>
          <textarea id="observacoes" name="observacoes" rows="4" cols="40"></textarea>
        </p>
 
        <p>
          <button type="submit">Salvar treino</button>
          <button type="reset">Limpar</button>
        </p>
      </form>
    </section>
 
    <hr>
    

    
</body>
</html>
